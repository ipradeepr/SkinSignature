{
  "$schema": "https://render.com/schema/v1",
  "services": [
    {
      "type": "web",
      "name": "skinsignature-backend",
      "runtime": "python",
      "plan": "free",
      "rootDir": "React_Wireframe/backend",
      "buildCommand": "pip install -r requirements.txt",
      "startCommand": "uvicorn main:app --host 0.0.0.0 --port $PORT",
      "healthCheckPath": "/v1/health",
      "envVars": [
        {
          "key": "PYTHON_VERSION",
          "value": "3.10.0"
        },
        {
          "key": "ALLOWED_ORIGINS",
          "value": "http://localhost:3000,https://*.vercel.app,https://www.skinsignature.com"
        }
      ]
    }
  ]
}
